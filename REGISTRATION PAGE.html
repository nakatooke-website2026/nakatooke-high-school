
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration - NAKHS</title>

    <style>
        body {
            background-color: skyblue;
            font-family: Arial;
            padding: 15px;
        }

        .container {
            background:skyblue;
            padding: 20px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            background: navy;
            color: white;
            padding: 15px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: navy;
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>NAKATOOKE HIGH SCHOOL</h1>

<h2>STUDENT REGISTRATION</h2>

<p>Welcome! Please fill in your details.</p>

<form>

<label>Student's Full Name</label>
<input type="text" placeholder="Enter full name" required>

<label>Date of Birth</label>
<input type="date" required>

<label>Gender</label>
<select required>
<option value="">Select gender</option>
<option>Male</option>
<option>Female</option>
</select>

<label>Class Applying For</label>
<select required>
<option value="">Select class</option>
<option>Senior One</option>
<option>Senior Two</option>
<option>Senior Three</option>
<option>Senior Four</option>
</select>

<label>Parent/Guardian Name</label>
<input type="text" placeholder="Parent's name" required>

<label>Parent/Guardian Telephone</label>
<input type="tel" placeholder="Telephone number" required>

<label>Previous School</label>
<input type="text" placeholder="Enter previous school">

<label>Additional Information</label>
<textarea placeholder="Enter any additional information"></textarea>

<button type="submit">SUBMIT REGISTRATION</button>

</form>

</div>

</body>
<marquee behavior="scroll"
direction="left"
scrollamount="4"
style="background-color: navy;
color: gold;
padding: 14px;
font-size: 17px;
font-weight: bold;">

WELCOME TO NAKATOOKE HIGH SCHOOL! 
YOUR FUTURE BEGINS HERE. 
PERSEVERANCE, DISCIPLINE AND HARD WORK LEAD TO SUCCESS.
JOIN US TODAY AND BECOME PART OF A STRONG GENERATION!

</marquee>

</html>
